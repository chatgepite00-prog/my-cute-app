<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>برای تو 🩵</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  direction: rtl;
  font-family: Tahoma, sans-serif;

  background:
    radial-gradient(circle at 20% 10%, #d9ffff, transparent 35%),
    radial-gradient(circle at 90% 90%, #9fdcff, transparent 35%),
    linear-gradient(135deg, #b8fff2, #9bd8ff);

  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.container {
  width: 92%;
  max-width: 430px;
}

.card {
  padding: 18px;
  border-radius: 30px;

  background: rgba(255,255,255,.30);
  backdrop-filter: blur(18px);

  border: 1px solid rgba(255,255,255,.55);

  box-shadow: 0 20px 60px rgba(40,130,160,.25);

  text-align: center;
  color: #16495c;
}

/* قاب عکس */

.photo {
  height: 320px;
  border-radius: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    linear-gradient(135deg,#d8fff8,#b7e7ff);

  box-shadow: inset 0 0 35px rgba(255,255,255,.7);
}

/* تصویر فانتزی */

.couple {
  position: relative;
  width: 250px;
  height: 250px;
}

/* سر نفر اول */

.person1 {
  position: absolute;
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: #f6c7a5;
  left: 35px;
  top: 55px;
}

/* مو */

.person1::before {
  content: "";
  position: absolute;
  width: 110px;
  height: 65px;
  background: #4b352d;
  border-radius: 60px 60px 20px 20px;
  left: -3px;
  top: -15px;
}

/* سر نفر دوم */

.person2 {
  position: absolute;
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: #eeb895;
  right: 35px;
  top: 55px;
}

/* مو نفر دوم */

.person2::before {
  content: "";
  position: absolute;
  width: 110px;
  height: 75px;
  background: #332a35;
  border-radius: 60px 60px 25px 25px;
  right: -3px;
  top: -18px;
}

/* بدن‌ها */

.body1,
.body2 {
  position: absolute;
  width: 125px;
  height: 105px;
  bottom: 5px;
  border-radius: 70px 70px 20px 20px;
}

.body1 {
  left: 20px;
  background: #8ee6d5;
}

.body2 {
  right: 20px;
  background: #8fcfff;
}

/* قلب وسط */

.kiss-heart {
  position: absolute;
  left: 50%;
  top: 48%;
  transform: translate(-50%,-50%);
  font-size: 42px;
  z-index: 5;
  animation: pulse 1.3s infinite;
}

@keyframes pulse {
  50% {
    transform: translate(-50%,-50%) scale(1.2);
  }
}

h1 {
  font-size: 26px;
  margin: 22px 5px 10px;
}

p {
  font-size: 17px;
  line-height: 2.1;
  margin: 0;
}

button {
  margin-top: 20px;
  border: 0;
  padding: 14px 28px;
  border-radius: 30px;

  background: #ffffff;
  color: #1686a0;

  font-size: 17px;
  font-weight: bold;

  box-shadow: 0 8px 25px rgba(30,120,150,.2);
}

button:active {
  transform: scale(.94);
}

/* قلب‌های شناور */

.heart {
  position: fixed;
  bottom: -50px;
  pointer-events: none;
  animation: fly 4s linear forwards;
}

@keyframes fly {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="photo">

      <div class="couple">

        <div class="body1"></div>
        <div class="body2"></div>

        <div class="person1"></div>
        <div class="person2"></div>

        <div class="kiss-heart">🩵</div>

      </div>

    </div>

    <h1 id="title">
      یه لحظه‌ی قشنگ...
    </h1>

    <p id="text">
      بعضی لحظه‌ها کوتاهن، ولی می‌تونن برای همیشه توی قلب آدم بمونن.
    </p>

    <button onclick="nextPage()">
      ادامه بده 🩵
    </button>

  </div>

</div>


<script>

const pages = [

  {
    title: "کنار تو...",
    text: "آرامش یعنی کنار کسی باشی که حتی سکوتش هم برایت قشنگ است."
  },

  {
    title: "یه حس قشنگ",
    text: "گاهی یک نفر وارد زندگی آدم می‌شود و دنیا را کمی شیرین‌تر می‌کند."
  },

  {
    title: "همین لحظه",
    text: "اگر می‌توانستم یک لحظه را برای همیشه نگه دارم، یکی از انتخاب‌هایم همین لبخند بود."
  },

  {
    title: "تو خاصی...",
    text: "نه به خاطر اینکه شبیه همه نیستی؛ به خاطر اینکه حضورت حس متفاوتی دارد."
  },

  {
    title: "یه آرزوی ساده",
    text: "آرزو می‌کنم هر روزت یک دلیل تازه برای لبخند زدن داشته باشد."
  },

  {
    title: "آخرش اینو بدون...",
    text: "بعضی آدم‌ها را نمی‌شود با چند جمله توصیف کرد؛ فقط باید قدر بودنشان را دانست. 🩵"
  }

];

let current = 0;

function nextPage() {

  if (current < pages.length) {

    document.getElementById("title").innerText =
      pages[current].title;

    document.getElementById("text").innerText =
      pages[current].text;

    current++;

    createHearts();

  } else {

    document.getElementById("title").innerText =
      "برای تو 🩵";

    document.getElementById("text").innerText =
      "این صفحه شاید کوچیک باشه، ولی امیدوارم یه لبخند بزرگ روی صورتت آورده باشه.";

    createHearts();
  }
}

function createHearts() {

  for (let i = 0; i < 12; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerText =
      ["🩵","💙","🤍","✨"][Math.floor(Math.random()*4)];

    heart.style.left =
      Math.random() * 100 + "vw";

    heart.style.fontSize =
      (16 + Math.random() * 25) + "px";

    heart.style.animationDuration =
      (3 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }
}

</script>

</body>
</html>
